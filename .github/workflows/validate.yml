name: validate

# Everything here runs without an Azure subscription, deliberately. The lab's
# claims should be checkable by anyone reading the repository, not only by
# someone who can deploy it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bicep:
    name: Build Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build all templates
        run: |
          for file in infra/*.bicep; do
            echo "::group::$file"
            az bicep build --file "$file" --stdout > /dev/null
            echo "::endgroup::"
          done

  python:
    name: Lint and verify the agent imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -r src/selfhosted/requirements.txt

      - name: Lint
        run: ruff check src experiments scripts

      - name: Import the shared agent
        # Catches the mistake that costs the most time downstream: a syntax or
        # import error that only surfaces after a ten-minute remote build.
        run: |
          cd src
          python -c "import agent_core; print(agent_core.__name__, 'ok')"

  surface:
    name: Deployment surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Recount lines of code
        # Experiment 3 is static analysis over the real files, so it runs
        # without a deployment. If someone adds 200 lines of Bicep, the ratio
        # in the README should change and this is where you notice.
        run: python experiments/03_deployment_surface.py

  hosted-package:
    name: Hosted agent package is self-contained
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Sync the shared agent into the hosted directory
        shell: pwsh
        run: ./scripts/prepare-hosted.ps1

      - name: Verify nothing outside the deploy directory is imported
        # A hosted agent deploys a directory. Anything the entry point imports
        # must be inside it - there is no editable install and no PYTHONPATH.
        run: python scripts/check_hosted_package.py
