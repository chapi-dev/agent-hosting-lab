# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: agent-hosting-lab
services:
    aghl-project:
        host: azure.ai.project
        # Written by `azd ai agent init` against the project created by
        # scripts/deploy.ps1. The value below is a placeholder: replace it with
        # your own project endpoint, or let `azd ai agent init` regenerate this
        # file. See runbooks/01-deploy-hosted-agent.md, Step 2.
        endpoint: https://<your-foundry-resource>.services.ai.azure.com/api/projects/<your-project>
    trip-planner:
        project: ./src/hosted
        host: azure.ai.agent
        language: python
        uses:
            - aghl-project
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        env:
            # The project endpoint is NOT declared here on purpose.
            #
            # The platform injects it as FOUNDRY_PROJECT_ENDPOINT, along with the
            # rest of the reserved FOUNDRY_/AGENT_ environment. Declaring a copy
            # is redundant and can shadow the platform value, so agent_core reads
            # the injected name directly.
            #
            # Only settings the platform cannot know about belong here.
            MODEL_DEPLOYMENT_NAME: gpt-5.4-mini
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: trip-planner
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
