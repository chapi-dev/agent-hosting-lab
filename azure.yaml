# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: agent-hosting-lab
services:
    aghl-project:
        host: azure.ai.project
        endpoint: https://aghl-foundry-nphhsfaf75l2a.services.ai.azure.com/api/projects/aghl-project
    trip-planner:
        project: ./src/hosted
        host: azure.ai.agent
        language: python
        uses:
            - aghl-project
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        env:
            # The project endpoint is NOT declared here on purpose.
            #
            # The platform injects it as FOUNDRY_PROJECT_ENDPOINT, along with the
            # rest of the reserved FOUNDRY_/AGENT_ environment. Declaring a copy
            # is redundant and can shadow the platform value, so agent_core reads
            # the injected name directly.
            #
            # Only settings the platform cannot know about belong here.
            MODEL_DEPLOYMENT_NAME: gpt-5.4-mini
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: trip-planner
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
